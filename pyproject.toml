[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allurix-mcstudio-mcp"
version = "0.1.0"
description = "A local MCP bridge for MCStudio Apollo operations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
allurix-mcp-proxy = "mcp_proxy:main"
allurix-mcp-stdio = "mcp_stdio_client:main"

[tool.setuptools]
py-modules = ["mcp_proxy", "mcp_stdio_client"]

[tool.setuptools.packages.find]
include = ["apollo_core*"]
